global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'distml-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000', 'host.docker.internal:5000']

  - job_name: 'distml-scheduler'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['scheduler:8000', 'host.docker.internal:8000']
